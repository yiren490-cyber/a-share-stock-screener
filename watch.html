<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A股实时盯盘</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/styles.css?v=20260731-reminder-tabs" />
  </head>
  <body class="watch-page">
    <main class="watch-shell">
      <section class="watch-topbar">
        <div class="watch-brand">
          <h1>A股实时盯盘</h1>
          <p id="watchStatus">输入股票代码，或从已有分组中选择股票。</p>
        </div>
        <div class="watch-controls">
          <label class="watch-symbol-field">
            <span>股票代码</span>
            <input id="watchSymbolInput" type="search" placeholder="600519 / sh600519" />
            <div id="watchSearchHistory" class="watch-search-history"></div>
          </label>
          <button id="watchLoadButton" type="button">载入</button>
          <button id="watchPrevButton" type="button" disabled>上一只</button>
          <button id="watchNextButton" type="button" disabled>下一只</button>
          <a class="watch-link-button" href="index.html">返回筛选器</a>
        </div>
        <div class="watch-alerts" id="alertLights" aria-label="预警灯">
          <div class="watch-alert-group">
            <div class="watch-alert-light" data-alert="minuteKdj"><span></span><strong>1分钟 KDJ&gt;80</strong></div>
            <div class="watch-alert-light" data-alert="intradayBlue"><span></span><strong>分时 深蓝</strong></div>
            <div class="watch-alert-light" data-alert="fiveMinuteBoll"><span></span><strong>5分钟 突破BOLL</strong></div>
            <div class="watch-alert-light" data-alert="dayBoll"><span></span><strong>日K 突破BOLL</strong></div>
          </div>
          <div class="watch-alert-group">
            <div class="watch-alert-light is-stop" data-stop-alert="warningPrice"><span></span><strong>预警价格：--</strong></div>
            <div class="watch-alert-light is-stop" data-stop-alert="ma5"><span></span><strong>5日均价：--</strong></div>
            <div class="watch-alert-light is-stop" data-stop-alert="ma10"><span></span><strong>10日均价：--</strong></div>
            <div class="watch-alert-light is-stop" data-stop-alert="ma17"><span></span><strong>17日均价：--</strong></div>
          </div>
        </div>
      </section>

      <section class="watch-audio-bar">
        <button id="enableSoundButton" type="button">启用预警音频</button>
        <label class="watch-upload-audio-button">
          <span>上传音频文件</span>
          <input id="alertAudioInput" type="file" accept="audio/*" multiple />
        </label>
        <select id="alertAudioSelect" aria-label="选择预警音频"></select>
        <button id="deleteAudioButton" type="button">删除音频</button>
        <label class="watch-effect-toggle">
          <input id="intradayEffectsToggle" type="checkbox" checked />
          <span>分时特效</span>
        </label>
        <button id="watchReminderButton" class="watch-reminder-button" type="button">提醒管理（0）</button>
      </section>

      <div id="watchBannerModal" class="watch-banner-modal" hidden>
        <div class="watch-banner-dialog" role="dialog" aria-modal="true" aria-labelledby="watchBannerTitle">
          <div class="watch-banner-dialog-head">
            <h2 id="watchBannerTitle">预警横幅内容</h2>
            <button id="watchBannerCloseButton" type="button" aria-label="关闭">×</button>
          </div>
          <div class="watch-default-banner-row">
            <textarea id="watchDefaultBannerInput" rows="2"></textarea>
            <button id="watchDefaultBannerSaveButton" type="button">保存默认内容</button>
          </div>
          <textarea id="watchBannerInput" rows="3"></textarea>
          <button id="watchBannerAddButton" type="button">添加内容</button>
          <div id="watchBannerList" class="watch-banner-list"></div>
        </div>
      </div>

      <section class="watch-main-grid">
        <aside class="watch-category-panel">
          <div class="watch-category-heading">
            <h2>股票分组</h2>
            <button id="watchManageCategoryButton" type="button">管理分组</button>
          </div>
          <div id="watchCategoryList" class="watch-category-list"></div>
        </aside>

        <section class="watch-realtime-panel">
          <div id="watchReminderToasts" class="watch-reminder-toasts" aria-live="polite"></div>
          <div class="watch-section-header">
            <div>
              <div class="watch-title-row">
                <h2 id="watchStockTitle">未选择股票</h2>
                <button id="watchNotesButton" class="watch-notes-button" type="button" aria-label="股票笔记" title="股票笔记">✎</button>
                <button id="watchAddCategoryButton" class="watch-add-category-button" type="button" aria-label="加入分组" title="加入分组">＋</button>
                <div id="watchNotesPreview" class="watch-notes-popover" hidden></div>
              </div>
              <p id="watchStockMeta">--</p>
            </div>
            <div id="watchPriceBadge" class="watch-price-badge">--</div>
          </div>
          <div class="watch-realtime-grid">
            <div class="watch-chart-card watch-intraday-card">
              <h3>分时图</h3>
              <div id="intradayInfo" class="watch-chart-info">--</div>
              <svg id="intradayChart" role="img" aria-label="分时图"></svg>
            </div>
            <div class="watch-order-card">
              <div id="orderBook" class="watch-order-book"></div>
            </div>
          </div>
        </section>
      </section>

      <section class="watch-zoom-bar" aria-label="K线缩放">
        <button id="watchBannerButton" type="button">横幅内容</button>
        <div id="watchAlertBanner" class="watch-alert-banner"><span></span></div>
        <button id="watchZoomInButton" type="button">放大</button>
        <button id="watchZoomOutButton" type="button">缩小</button>
        <button id="watchZoomResetButton" type="button">重置</button>
      </section>
      <section id="periodPanels" class="watch-period-grid" aria-label="周期图"></section>

      <div class="modal-backdrop" id="watchCategoryModal" hidden>
        <div class="category-modal" role="dialog" aria-modal="true" aria-label="保存到分组">
          <div class="modal-header">
            <h3>保存到分组</h3>
            <button id="watchCloseCategoryModalButton" type="button">关闭</button>
          </div>
          <div class="modal-body">
            <label>
              选择已有分组
              <select id="watchSaveCategorySelect" aria-label="保存到已有分组"></select>
            </label>
            <div class="new-category-row">
              <button id="watchShowNewCategoryButton" type="button">添加分组</button>
              <input id="watchCategoryNameInput" type="text" placeholder="填写分组名" />
              <button id="watchCreateCategoryButton" type="button">保存</button>
            </div>
          </div>
          <div class="modal-actions">
            <button id="watchSaveCategoryButton" type="button">确认保存</button>
          </div>
        </div>
      </div>

      <div class="modal-backdrop" id="watchManageCategoryModal" hidden>
        <div class="category-modal" role="dialog" aria-modal="true" aria-label="管理分组">
          <div class="modal-header">
            <h3>管理分组</h3>
            <button id="watchCloseManageCategoryButton" type="button">关闭</button>
          </div>
          <div class="modal-body">
            <div class="manage-category-list" id="watchManageCategoryList"></div>
            <div class="new-category-row is-adding">
              <button id="watchAddManagedCategoryButton" type="button">新增分组</button>
              <input id="watchManagedCategoryNameInput" type="text" placeholder="填写分组名" />
              <button id="watchSaveManagedCategoryButton" type="button">保存</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-backdrop" id="watchReminderModal" hidden>
        <div class="watch-reminder-modal" role="dialog" aria-modal="true" aria-label="提醒管理">
          <div class="modal-header">
            <h3>提醒管理</h3>
            <button id="watchReminderCloseButton" type="button">关闭</button>
          </div>
          <div class="watch-reminder-content">
            <div class="watch-reminder-tabs-row">
              <div class="watch-reminder-tabs" role="tablist" aria-label="提醒管理">
                <button id="watchReminderRulesTab" class="is-active" type="button" role="tab" aria-controls="watchReminderRulesPanel" aria-selected="true" data-reminder-tab="rules">提醒规则</button>
                <button id="watchReminderHistoryTab" type="button" role="tab" aria-controls="watchReminderHistoryPanel" aria-selected="false" data-reminder-tab="history">触发历史</button>
              </div>
              <button id="watchOpenAddReminderButton" class="watch-add-reminder-button" type="button">添加提醒</button>
            </div>
            <section id="watchReminderRulesPanel" class="watch-reminder-section" role="tabpanel" aria-labelledby="watchReminderRulesTab">
              <div id="watchReminderRulesList" class="watch-reminder-list"></div>
            </section>
            <section id="watchReminderHistoryPanel" class="watch-reminder-section" role="tabpanel" aria-labelledby="watchReminderHistoryTab" hidden>
              <div class="watch-reminder-history-head">
                <button id="watchClearReminderHistoryButton" type="button">一键清空</button>
              </div>
              <div id="watchReminderHistoryList" class="watch-reminder-history"></div>
            </section>
          </div>
        </div>
      </div>

      <div class="modal-backdrop" id="watchAddReminderModal" hidden>
        <div class="watch-add-reminder-modal" role="dialog" aria-modal="true" aria-label="添加提醒">
          <div class="modal-header">
            <h3>添加提醒</h3>
            <button id="watchAddReminderCloseButton" type="button">关闭</button>
          </div>
          <div class="watch-reminder-form">
            <label>
              股票代码
              <input id="watchReminderSymbolInput" type="text" placeholder="600519 / sh600519" />
            </label>
            <label>
              提醒类型
              <select id="watchReminderConditionSelect">
                <option value="price">股票价格提醒</option>
                <option value="range">股票价格区间提醒</option>
                <option value="ma">股票均线提醒</option>
                <option value="boll">股票BOLL线指标提醒</option>
              </select>
            </label>
            <label>
              周期
              <select id="watchReminderPeriodSelect">
                <option value="m1">1分钟</option>
                <option value="m5">5分钟</option>
                <option value="m15">15分钟</option>
                <option value="m30">30分钟</option>
                <option value="m60">60分钟</option>
                <option value="day">日K</option>
              </select>
            </label>
            <label data-reminder-field="priceDirection">
              方向
              <select id="watchReminderPriceDirectionSelect">
                <option value="above">高于</option>
                <option value="below">低于</option>
              </select>
            </label>
            <label data-reminder-field="targetPrice">
              价格
              <input id="watchReminderTargetInput" type="number" step="0.01" placeholder="目标价" />
            </label>
            <label data-reminder-field="priceRange">
              最低价
              <input id="watchReminderMinInput" type="number" step="0.01" placeholder="最低价" />
            </label>
            <label data-reminder-field="priceRange">
              最高价
              <input id="watchReminderMaxInput" type="number" step="0.01" placeholder="最高价" />
            </label>
            <label data-reminder-field="maDirection">
              方向
              <select id="watchReminderMaDirectionSelect">
                <option value="above">高于</option>
                <option value="below">低于</option>
              </select>
            </label>
            <label data-reminder-field="maPeriod">
              均线
              <select id="watchReminderMaSelect">
                <option value="5">MA5</option>
                <option value="10">MA10</option>
                <option value="17">MA17</option>
                <option value="20">MA20</option>
                <option value="60">MA60</option>
              </select>
            </label>
            <label data-reminder-field="bollDirection">
              BOLL方向
              <select id="watchReminderBollDirectionSelect">
                <option value="above">突破</option>
                <option value="below">跌破</option>
              </select>
            </label>
            <label data-reminder-field="bollLine">
              BOLL线
              <select id="watchReminderBollLineSelect">
                <option value="upper">上轨</option>
                <option value="middle">中轨</option>
                <option value="lower">下轨</option>
              </select>
            </label>
            <button id="watchAddReminderRuleButton" type="button">保存提醒</button>
          </div>
        </div>
      </div>

      <div id="watchNotesModal" class="watch-notes-modal" hidden>
        <div class="watch-notes-dialog" role="dialog" aria-modal="true" aria-labelledby="watchNotesTitle">
          <div class="watch-notes-dialog-head">
            <h2 id="watchNotesTitle">股票笔记</h2>
            <button id="watchNotesCloseButton" type="button" aria-label="关闭">×</button>
          </div>
          <div id="watchNotesEditor" class="watch-notes-columns"></div>
        </div>
      </div>
    </main>

    <script src="assets/listing-dates.js"></script>
    <script src="assets/watch.js?v=20260731-reminder-tabs"></script>
    <script>
      window.stockWatch.initWatchPage(document);
    </script>
  </body>
</html>
